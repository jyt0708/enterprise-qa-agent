[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-kb-agent"
version = "0.1.0"
description = "Enterprise knowledge QA agent built with LangGraph"
requires-python = ">=3.14"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "pydantic>=2",
    "python-dotenv",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]